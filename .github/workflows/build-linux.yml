name: Build Linux

# Compila l'AppImage per Linux Mint / Ubuntu su un server Linux di GitHub.
# - Ubuntu 22.04: i binari compilati qui partono su Linux Mint 21 e 22
#   (una build su un sistema più recente non partirebbe su quelli più vecchi);
# - a ogni push sul ramo main e manualmente (Actions > Build Linux > Run workflow):
#   il pacchetto si scarica da "Artifacts" in fondo alla pagina dell'esecuzione;
# - quando si crea un tag v* (es. v1.1.0): AppImage e tar.gz vengono allegati alla
#   stessa Release dello zip Windows.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Librerie di sistema per Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libegl1 libgl1 libxkbcommon-x11-0 libpulse0 libfuse2 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 desktop-file-utils

      - name: Test e build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/build_linux.sh --no-venv

      - name: Controllo del file .desktop
        continue-on-error: true
        run: desktop-file-validate build/AppDir/simplecutvideo.desktop

      - name: Pubblica il pacchetto (Artifacts)
        uses: actions/upload-artifact@v6
        with:
          name: SimpleCutVideo-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          retention-days: 30

      - name: Pubblica la Release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.tar.gz
